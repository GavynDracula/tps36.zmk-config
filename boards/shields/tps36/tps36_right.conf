CONFIG_INPUT=y

# Upstream ZMK pointing device framework.
# CONFIG_ZMK_MOUSE is the deprecated alias for this.
CONFIG_ZMK_POINTING=y

# The PS/2 driver module reads the trackpoint through the interrupt driven
# UART API (uart_irq_rx_ready / uart_fifo_read). Zephyr 4.1 can also build the
# nRF UART with the asynchronous API, and the module's Kconfig only selects
# UART_ASYNC_API - so without this the UART ends up on the async driver and
# the module never sees a single byte.
#
# Enabling it globally also selects it for uart0, which is the UART the
# trackpoint is wired to.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_0_INTERRUPT_DRIVEN=y

# Zephyr 4.1 funnels input events through a message queue that the input
# thread drains, and the PS/2 driver reports its packets with K_NO_WAIT, so
# every event that arrives while the queue is full is dropped. The default
# queue is 16 entries, which is not enough to absorb the mouse reports that
# the BLE connection interval allows.
CONFIG_INPUT_QUEUE_MAX_MSGS=64

CONFIG_ZMK_EXT_POWER=y

### Trackpoint ###

# On-device RawAccel-style velocity curve.
# Shaping the curve in the driver (instead of relying on the trackpoint's
# coarse 8 bit acceleration curve) is what makes the pointer feel smooth:
# it keeps the fractional remainder of every movement delta and only rounds
# once, at the very end.
#
# The curve parameters themselves live on the `&mouse_ps2` node in
# config/include/mouse_tp.dtsi (curve-sens / curve-rate / curve-exponent /
# curve-start).
#
# Note: this compiles power_curve.c, which calls float pow() at init, so it
# needs a real libc.
CONFIG_ZMK_INPUT_MOUSE_PS2_POWER_CURVE=y
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y

# Median filter over the last 3 movement deltas per axis.
# Kills the spike bursts that PS/2 packet boundary slips inject into the
# motion stream (they show up as the cursor jumping for a frame).
CONFIG_ZMK_INPUT_MOUSE_PS2_MEDIAN_WINDOW=3

# Exponential moving average over the movement deltas.
# Dampens the per bit decode wobble where an errored bit 7 flips a delta
# between +127 and -128 on otherwise identical bytes. This is the main
# source of the "erratic cursor" feeling.
#
# Every extra sample adds latency, so keep this low. 1 = off.
CONFIG_ZMK_INPUT_MOUSE_PS2_MOVEMENT_EMA_N=4

# Slew rate limiter: an isolated delta above this value is dropped unless
# the previous report was above it too, so a sustained fast flick still
# works while a lone spike is treated as a glitch.
# 0 = off.
CONFIG_ZMK_INPUT_MOUSE_PS2_SLEW_MAX=0

# Print one line per second with decode counters (bytes, packets, alignment
# aborts, buffer timeouts). Useful to see whether the PS/2 link is healthy.
CONFIG_ZMK_INPUT_MOUSE_PS2_TELEMETRY=y

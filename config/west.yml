manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: Magid-William
      url-base: https://github.com/Magid-William

  projects:

    #
    # ZMK
    #
    # Upstream ZMK main. Since PR #2027 was merged, the pointing device
    # framework (app/src/pointing) lives in main, so no fork is needed.
    #
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml

    #
    # Additional zmk modules
    #

    # Module for PS/2 mouse & TrackPoint driver.
    #
    # ZMK main still has no PS/2 input driver (PR #1751 is unmerged and
    # Zephyr has no generic PS/2 mouse driver), so an external module is
    # required. This is the actively maintained fork of
    # infused-kim/kb_zmk_ps2_mouse_trackpoint_driver with:
    #   - Zephyr 4.1 build fixes
    #   - On-device RawAccel-style power curve
    #   - Anti-glitch filters (median / slew / EMA)
    #   - Speed divisor with remainder accumulation
    - name: zmk-ps2-trackpoint-driver
      remote: Magid-William
      revision: main

  self:
    path: config
